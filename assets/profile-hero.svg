    <text x="846" y="213" fill="#f0f4f8" font-size="18" font-weight="600">Inference runtime</text>
    <text x="846" y="237" fill="#aab6c3" font-size="12" letter-spacing="1">ORCHESTRATE / EXECUTE / OPTIMIZE</text>
    <circle cx="1202" cy="205" r="3" fill="#fb923c"/>

