      <rect x="988" y="93" width="72" height="52" rx="12"/>
      <rect x="1156" y="93" width="72" height="52" rx="12"/>
    </g>
    <g fill="none" stroke="#88c7cc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
