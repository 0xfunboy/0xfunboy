<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">0xfunboy: From agents to silicon.</title>
  <desc id="desc">Founder and AI systems builder. Agent systems, inference engines, and hardware, illustrated as connected agents flowing through an inference runtime to two compute chips.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 H 0 V 28" fill="none" stroke="#22303d" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.65"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1280" height="420" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <rect width="1280" height="420" rx="18" fill="#0b1119"/>
  <rect x="1" y="1" width="1278" height="418" rx="17" fill="none" stroke="#293543"/>
  <rect x="640" y="1" width="639" height="418" rx="17" fill="url(#grid)" mask="url(#gridMask)"/>
  <path d="M 56 0 V 20" stroke="#fb923c" stroke-width="4"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="56" y="77" fill="#f0f4f8" font-size="30" font-weight="700" letter-spacing="-1">0xfunboy<tspan fill="#fb923c">.</tspan></text>
    <text x="57" y="110" fill="#aab6c3" font-size="13" font-weight="600" letter-spacing="2.3">FOUNDER / AI SYSTEMS BUILDER</text>

    <text x="52" y="214" fill="#f0f4f8" font-size="76" font-weight="700" letter-spacing="-3.5">From agents</text>
    <text x="52" y="296" fill="#f0f4f8" font-size="76" font-weight="700" letter-spacing="-3.5">to silicon<tspan fill="#fb923c">.</tspan></text>

    <path d="M 56 336 H 672" stroke="#2a3542"/>
    <text x="56" y="373" fill="#aab6c3" font-size="13" font-weight="500" letter-spacing="1.5">AGENT SYSTEMS <tspan fill="#fb923c">/</tspan> INFERENCE ENGINES <tspan fill="#fb923c">/</tspan> HARDWARE</text>

    <text x="820" y="61" fill="#8093a6" font-size="11" font-weight="600" letter-spacing="2">BUILD · MEASURE · REFINE</text>

    <g fill="none" stroke="#496374" stroke-width="1.5">
