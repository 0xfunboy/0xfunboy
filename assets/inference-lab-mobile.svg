<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Dual Strix Halo inference lab</title>
  <desc id="desc">Two EVO-X3 systems connected by USB4. Each has a Ryzen AI Max+ 395, Radeon 8060S graphics, and 128 GB of unified memory. The 256 GB aggregate memory is installed across two separate nodes, with 128 GB per node. Research areas include ROCm, gfx1151, and tensor parallelism.</desc>
