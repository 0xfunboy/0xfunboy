<title id="title">aireward-llm: dual RTX 3090 workstation</title><desc id="desc">aireward-llm workstation with two NVIDIA GeForce RTX 3090 graphics cards, each with 24 GB GDDR6X dedicated memory. Intel Core i5-13500, 128 GB system RAM, and Samsung 990 PRO 2 TB NVMe. Dashed conceptual connection indicates the research goal of a hybrid cluster with two AMD Strix Halo nodes, not a verified operational link.</desc>
