<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Dual Strix Halo inference lab</title>
  <desc id="desc">Two EVO-X3 systems connected by USB4. Each has an AMD Ryzen AI Max+ 395, Radeon 8060S graphics, and 128 GB of unified memory. Total installed memory is 256 GB across two separate nodes. Research areas include ROCm, gfx1151, and tensor parallelism.</desc>
  <rect width="1280" height="380" rx="18" fill="#0b1119"/>
  <rect x="1" y="1" width="1278" height="378" rx="17" fill="none" stroke="#293543"/>
  <path d="M 56 0 V 20" stroke="#fb923c" stroke-width="4"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="56" y="57" fill="#f0f4f8" font-size="25" font-weight="650" letter-spacing="0.6">DUAL STRIX HALO LAB</text>
    <text x="56" y="84" fill="#aab6c3" font-size="15" letter-spacing="0.6">ROCm · gfx1151 · tensor parallelism</text>
    <text x="1224" y="56" fill="#8393a4" font-size="12" font-weight="500" letter-spacing="1.8" text-anchor="end">LOCAL INFERENCE / REAL HARDWARE</text>

    <rect x="56" y="114" width="508" height="192" rx="12" fill="#121c27" stroke="#334456"/>
    <rect x="716" y="114" width="508" height="192" rx="12" fill="#121c27" stroke="#334456"/>
    <path d="M 56 146 V 178 M 716 146 V 178" stroke="#fb923c" stroke-width="3"/>

    <g fill="none" stroke="#5c7586" stroke-width="2">
      <path d="M 111 173 V 185 M 129 173 V 185 M 147 173 V 185 M 165 173 V 185 M 111 239 V 251 M 129 239 V 251 M 147 239 V 251 M 165 239 V 251 M 91 191 H 103 M 91 209 H 103 M 91 227 H 103 M 175 191 H 187 M 175 209 H 187 M 175 227 H 187"/>
      <path d="M 771 173 V 185 M 789 173 V 185 M 807 173 V 185 M 825 173 V 185 M 771 239 V 251 M 789 239 V 251 M 807 239 V 251 M 825 239 V 251 M 751 191 H 763 M 751 209 H 763 M 751 227 H 763 M 835 191 H 847 M 835 209 H 847 M 835 227 H 847"/>
    </g>
    <g fill="#1b2b38" stroke="#81bdc5">
      <rect x="103" y="185" width="72" height="54" rx="5"/>
      <rect x="763" y="185" width="72" height="54" rx="5"/>
    </g>
    <g fill="#b6dbe0" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1">
      <text x="139" y="218">APU</text>
      <text x="799" y="218">APU</text>
    </g>

    <g fill="#f0f4f8" font-size="24" font-weight="650">
      <text x="215" y="159">EVO-X3</text>
      <text x="875" y="159">EVO-X3</text>
    </g>
    <g fill="#cad3dc" font-size="18">
      <text x="215" y="196">Ryzen AI Max+ 395</text>
      <text x="875" y="196">Ryzen AI Max+ 395</text>
      <text x="215" y="224">Radeon 8060S</text>
      <text x="875" y="224">Radeon 8060S</text>
    </g>
    <g fill="#aab6c3" font-size="17">
      <text x="215" y="266"><tspan fill="#f1c8a7" font-weight="600">128 GB</tspan> unified memory</text>
      <text x="875" y="266"><tspan fill="#f1c8a7" font-weight="600">128 GB</tspan> unified memory</text>
    </g>
    <g fill="#788b9e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1">
      <text x="534" y="143" text-anchor="end">01</text>
