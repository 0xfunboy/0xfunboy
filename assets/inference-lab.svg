    <path d="M 56 330 H 1224" stroke="#293543"/>
    <text x="56" y="356" fill="#aab6c3" font-size="15" letter-spacing="0.5"><tspan fill="#e0e6ed" font-weight="600">256 GB aggregate</tspan> · 128 GB per node</text>
    <text x="1224" y="356" fill="#8393a4" font-size="12" font-weight="500" letter-spacing="1.6" text-anchor="end">TWO NODES. ONE SYSTEMS LAB.</text>
