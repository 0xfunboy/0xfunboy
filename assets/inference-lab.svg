    <text x="640" y="189" fill="#f1c8a7" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1">USB4</text>
    <path d="M 564 210 H 716" fill="none" stroke="#d69a68" stroke-width="2"/>
    <path d="M 612 206 V 214 M 624 206 V 214 M 636 206 V 214 M 648 206 V 214 M 660 206 V 214 M 672 206 V 214" stroke="#d69a68" stroke-width="1.5"/>
